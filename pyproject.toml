[project]
name = "crossborder-cs"
version = "0.1.0"
description = "Multi-tenant cross-border e-commerce customer service workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "langgraph>=0.2.60,<2",
    "langgraph-checkpoint-postgres>=2.0,<4",
    "mcp>=1.2,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "paramiko>=3.5,<5",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: fast tests without database",
    "integration: tests against a real PostgreSQL database",
    "e2e: HTTP or browser end-to-end tests",
    "slow: slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]